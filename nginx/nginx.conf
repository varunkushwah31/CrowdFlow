user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" RT=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Allow up to 30MB uploads for high-resolution mobile camera incident photos
    client_max_body_size 30M;

    # Gzip Compression for GeoJSON vectors, JSON APIs, and Web Assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/geo+json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml;

    # Rate Limiting: 15 requests per minute per IP for report submissions
    limit_req_zone $binary_remote_addr zone=report_submit_limit:10m rate=15r/m;
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=100r/m;

    upstream crowdflow_backend {
        server app:8085;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Healthcheck endpoint
        location /healthz {
            access_log off;
            return 200 "healthy\n";
        }

        # Real-Time Server-Sent Events (SSE) Live Stream (No Buffering)
        location ~ ^/api/reports/track/.+/live-stream$ {
            proxy_pass http://crowdflow_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cache-Control "no-cache";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # Rate-limited Incident Intake API
        location /api/reports {
            limit_req zone=report_submit_limit burst=5 nodelay;

            proxy_pass http://crowdflow_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # General REST APIs, Geospatial Streams & Media
        location /api/ {
            limit_req zone=api_general_limit burst=20 nodelay;

            proxy_pass http://crowdflow_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Prometheus / Actuator Metrics
        location /actuator/ {
            proxy_pass http://crowdflow_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Swagger API Documentation UI
        location /swagger-ui/ {
            proxy_pass http://crowdflow_backend;
            proxy_set_header Host $host;
        }

        # Swagger Docs JSON
        location /v3/api-docs {
            proxy_pass http://crowdflow_backend;
            proxy_set_header Host $host;
        }

        # Web Dashboard Static UI & Assets
        location / {
            proxy_pass http://crowdflow_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
