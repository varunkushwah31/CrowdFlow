<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Delhi Jal Board & Municipal Water Command Room — WaterWatch India</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico"/>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gov: {
              950: '#070b14',
              900: '#0b1120',
              850: '#0f172a',
              800: '#1e293b',
              700: '#334155',
              600: '#475569',
              500: '#64748b'
            },
            civic: {
              blue: '#0284c7',
              cyan: '#06b6d4',
              emerald: '#10b981',
              amber: '#f59e0b',
              rose: '#ef4444',
              purple: '#8b5cf6'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>

  <!-- Font Awesome 6 Pro Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <!-- Leaflet GIS CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- React 18, ReactDOM 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js for Executive Telemetry Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom Admin Control Center Styles -->
  <link rel="stylesheet" href="/admin/admin.css"/>

<body class="bg-gov-950 text-slate-100 min-h-screen antialiased selection:bg-civic-blue selection:text-white">

  <!-- React Application Mount Point -->
  <div id="admin-root">
    <div class="flex items-center justify-center min-h-screen">
      <div class="text-center p-8">
        <i class="fa-solid fa-circle-notch fa-spin text-4xl text-civic-blue mb-4"></i>
        <p class="text-slate-400 font-medium">Bootstrapping Municipal Command Center...</p>
      </div>
    </div>
  </div>

  <!-- React Application Core Component Script -->
  <script type="text/babel" src="/admin/app.jsx"></script>
</body>
</html>
