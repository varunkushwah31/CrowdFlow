name: crowdflow_mobile
description: "CrowdFlow Indian Civic Water Monitoring & Incident Crowdsourcing Mobile App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Map Rendering: GPU-accelerated vector tiles and cluster bubbles
  maplibre_gl: ^0.16.0

  # Geolocation: High-accuracy GPS capture
  geolocator: ^11.0.0

  # Media Capture: Live camera intake
  camera: ^0.10.5+9
  image_picker: ^1.0.7

  # Hardware EXIF: Reads raw GPS Lat/Lon, Altitude, and Timestamp
  native_exif: ^0.5.1

  # Local Offline Storage: Resilient SQLite offline queue
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.2
  path: ^1.9.0

  # Networking: Chunked multipart HTTP upload with background retry
  dio: ^5.4.1

  # State Management & Utilities
  provider: ^6.1.1
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  drift_dev: ^2.14.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
