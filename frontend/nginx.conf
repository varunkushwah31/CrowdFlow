server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml;

    # Healthcheck
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    # API Proxy to CrowdFlow Backend (when deployed alongside backend container)
    location /api/ {
        proxy_pass http://${BACKEND_HOST:-app}:${BACKEND_PORT:-8085};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # SPA routing fallback (handles / and /admin via React client router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
